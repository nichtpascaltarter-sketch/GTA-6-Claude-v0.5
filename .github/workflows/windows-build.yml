name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: Windows x64 / MSVC
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test MSVC bit scans and pause-menu input
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
          if not exist build mkdir build
          cl /nologo /std:c++17 /utf-8 /O2 /EHsc /W4 /WX tests\compiler\bit_scan_test.cpp /Fe:build\bit_scan_test.exe /Fo:build\bit_scan_test.obj || exit /b 1
          build\bit_scan_test.exe || exit /b 1
          call tests\ui\build.bat || exit /b 1
      - name: Build game
        shell: cmd
        run: call build.bat
      - name: Check that the exe carries its commit (the updater compares it with main)
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $exe = Join-Path (Get-Location) "bin\NeonTide.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if (-not $text.Contains($sha)) { Write-Error "bin\NeonTide.exe does not carry commit $sha"; exit 1 }
          Write-Output "bin\NeonTide.exe carries commit $sha"
      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeonTide-Windows-x64
          path: bin/NeonTide.exe
          if-no-files-found: error
          retention-days: 14
      - name: Package matching source
        shell: cmd
        run: git archive --format=zip --output=build/NeonTide-source.zip HEAD
      - name: Upload matching source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeonTide-source
          path: build/NeonTide-source.zip
          if-no-files-found: error
          retention-days: 14
  gcc:
    name: GCC bit-scan regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test GCC bit scans with undefined-behavior sanitizer
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=undefined tests/compiler/bit_scan_test.cpp -o /tmp/neontide-bit-scan-test
          /tmp/neontide-bit-scan-test
      - name: Test updater logic (GitHub compare and commit answers, pull requests, toolchains, build commands, PE headers)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=undefined tests/updater/update_logic_test.cpp -o /tmp/neontide-update-logic-test
          /tmp/neontide-update-logic-test
      - name: Test world file formats (NTG grids, NTW parser, formatter and schema, LZ, world.bin)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=undefined tests/world/world_format_test.cpp -o /tmp/neontide-world-format-test
          /tmp/neontide-world-format-test
      - name: Test the world validator (ids, references, layouts, the cache)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=undefined tests/world/worldv_test.cpp -o /tmp/neontide-worldv-test
          /tmp/neontide-worldv-test
      - name: Test the world model (loader, references, roads compile)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=undefined tests/world/worldmodel_test.cpp -o /tmp/neontide-worldmodel-test
          /tmp/neontide-worldmodel-test
      - name: Validate the hand-built world
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I. tools/worldv.cpp -o /tmp/neontide-worldv
          /tmp/neontide-worldv --world=world --no-cache
