name: Apply Escape regression fix
on:
  push:
    branches: [fix/windows-build]
    paths: [.github/workflows/inspect-escape.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/windows-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply reviewed source replacements
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          expected = {
              'src/game/app.cpp': '9b43215c19c9e95b1596578a3934219d24c4c5a9',
              'src/ui/hud.h': 'c8eb685a456b3df1092a1576f9a0c6ac3e7d8846',
              'src/ui/menus.cpp': '67f950251d8f1b7e16a1248fa07f3ddbb5a8edf4',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise RuntimeError(f'{path} changed; refusing to overwrite unrelated work')
          def edit(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one matching section in {path}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          edit('src/ui/hud.h', 'namespace Menus {\n',
               'namespace Menus {\n// Start a fresh pause-menu session. The first update draws but ignores the input\n// that opened it (Esc, controller Start, a remapped key, or a phone-map click).\nvoid openPause(MenuState& state, MenuScreen screen = MENU_PAUSE);\n')
          edit('src/ui/menus.cpp', '    MenuScreen root = MENU_NONE;\n',
               '    MenuScreen root = MENU_NONE;\n    bool ignoreOpeningInput = false;  // consume the opening frame, not a timed debounce\n')
          edit('src/ui/menus.cpp', 'void reset() { menus_ui::I = menus_ui::Internal(); }\n',
               'void reset() { menus_ui::I = menus_ui::Internal(); }\n\nvoid openPause(MenuState& st, MenuScreen screen) {\n    // update() is only called while a menu is visible, so it may never observe\n    // MENU_NONE between sessions. Explicitly clear stale dialogs, focus and tabs.\n    reset();\n    st.screen = screen;\n    st.prevScreen = MENU_NONE;\n    st.cursor = st.tab = 0;\n    menus_ui::I.ignoreOpeningInput = true;\n}\n')
          edit('src/ui/menus.cpp', 'MenuAction update(MenuState& st, const InputState& in, float dt) {\n    using namespace menus_ui;\n',
               'MenuAction update(MenuState& st, const InputState& rawInput, float dt) {\n    using namespace menus_ui;\n    // The app opens the menu and updates it in the same frame. Keep pointer/pad\n    // presentation, but do not reuse the opening press as Back, Confirm or a map\n    // click. Later updates use the real previous-key state, so holding Esc cannot\n    // close the menu; a fresh press works immediately, at any frame rate.\n    InputState openingInput;\n    openingInput.mousePos = rawInput.mousePos;\n    openingInput.lastInputWasPad = rawInput.lastInputWasPad;\n    openingInput.pad.connected = rawInput.pad.connected;\n    const InputState& in = I.ignoreOpeningInput ? openingInput : rawInput;\n    I.ignoreOpeningInput = false;\n')
          edit('src/ui/menus.cpp', '    if (n.start && I.dialog == DLG_NONE && I.openT > 0.2f) exit = true;   // not the press that opened the menu\n',
               '    if (n.start && I.dialog == DLG_NONE) exit = true;   // opening input is consumed by openPause/update\n')
          edit('src/game/app.cpp', '    void openPause(UI::MenuScreen s) {\n        menu.screen = s;\n        menu.cursor = 0;\n        menu.tab = 0;\n',
               '    void openPause(UI::MenuScreen s) {\n        UI::Menus::openPause(menu, s);\n        game.paused = true;\n        game.ctl = Controls();\n        Platform::setMouseCaptured(false);\n        Platform::setGamepadRumble(0.f, 0.f);\n')
          edit('src/game/app.cpp', '            case UI::MA_RESUME:\n                menu.screen = UI::MENU_NONE;\n',
               '            case UI::MA_RESUME:\n                menu.screen = UI::MENU_NONE;\n                game.paused = false;\n                Platform::setMouseCaptured(Platform::hasFocus() && !autotest);\n')
      - name: Commit only the three reviewed gameplay and UI files
        run: |
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/app.cpp src/ui/hud.h src/ui/menus.cpp
          git commit -m 'fix: consume opening Escape input and reset pause-menu sessions'
          git push origin HEAD:fix/windows-build
