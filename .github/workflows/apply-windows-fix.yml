name: Apply Windows portability patch

on:
  push:
    branches: [fix/windows-build]
    paths: [.github/workflows/apply-windows-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/fix/windows-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact source changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one matching section in {path}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          expected = {
              'src/gfx/gfx_context.cpp': '8d39fea467bd32601bcdcd30e7416f2aa4c64734',
              'src/main.cpp': '6d3b91a5833e5ac5da1bf2074088d7c7cb3d7d13',
              'build.bat': '958e09d55ff53e156e2e937ab155b5c71bf79723',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise RuntimeError(f'{path} changed; refusing to overwrite unrelated work')

          header = Path('src/core/bits.h')
          test = Path('tests/compiler/bit_scan_test.cpp')
          if header.exists() or test.exists():
              raise RuntimeError('Refusing to overwrite an existing helper or test')
          header.write_text('''// Portable 64-bit bit scans. An empty mask returns 64, outside the valid indices.
          #pragma once
          #include <cstdint>
          #if defined(_MSC_VER)
          #include <intrin.h>
          #endif

          namespace BitScan {
          inline unsigned lowestSetBit64(std::uint64_t mask) {
              if (!mask) return 64;
          #if defined(_MSC_VER)
              unsigned long index;
              _BitScanForward64(&index, mask);
              return static_cast<unsigned>(index);
          #else
              return static_cast<unsigned>(__builtin_ctzll(mask));
          #endif
          }

          inline unsigned highestSetBit64(std::uint64_t mask) {
              if (!mask) return 64;
          #if defined(_MSC_VER)
              unsigned long index;
              _BitScanReverse64(&index, mask);
              return static_cast<unsigned>(index);
          #else
              return 63u - static_cast<unsigned>(__builtin_clzll(mask));
          #endif
          }
          }  // namespace BitScan
          '''.replace('\n          ', '\n'), encoding='utf-8')
          replace_once('src/gfx/gfx_context.cpp', 'namespace gfx {\nnamespace {',
                       '#include "../core/bits.h"\n\nnamespace gfx {\nnamespace {')
          replace_once('src/gfx/gfx_context.cpp',
                       'inline u32 lowestBit(u64 m) { return (u32)__builtin_ctzll(m); }\ninline u32 highestBit(u64 m) { return 63u - (u32)__builtin_clzll(m); }',
                       'inline u32 lowestBit(u64 m) { return BitScan::lowestSetBit64(m); }\ninline u32 highestBit(u64 m) { return BitScan::highestSetBit64(m); }')
          replace_once('src/main.cpp', '#include "gfx/gfx.cpp"\n',
                       '#include "gfx/gfx.cpp"\n// The Windows SDK RPC headers define small as char. Do not leak that macro\n// into the game modules below, which use small as an ordinary identifier.\n#ifdef small\n#undef small\n#endif\n')

          # Prefer an explicitly initialized x64 toolchain, even from an x86 developer prompt.
          replace_once('build.bat', 'where cl >nul 2>nul\nif %errorlevel%==0 goto msvc\n\n', 'set "VSINSTALL="\n')
          replace_once('build.bat', 'call "%VSINSTALL%\\VC\\Auxiliary\\Build\\vcvars64.bat" >nul',
                       'call "%VSINSTALL%\\VC\\Auxiliary\\Build\\vcvars64.bat" >nul\n  if errorlevel 1 exit /b 1')
          replace_once('build.bat', 'where g++ >nul 2>nul', 'where cl >nul 2>nul\nif %errorlevel%==0 goto msvc\n\nwhere g++ >nul 2>nul')
          replace_once('build.bat', 'cl /nologo /O2 /EHsc tools', 'cl /nologo /std:c++17 /utf-8 /O2 /EHsc tools')
          replace_once('build.bat', 'cl /nologo /std:c++17 /O2 /Oi', 'cl /nologo /std:c++17 /utf-8 /O2 /Oi')

          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''#include "../../src/core/bits.h"
          #include <cstdio>

          static bool check(std::uint64_t mask) {
              unsigned lo = 64, hi = 64;
              for (unsigned i = 0; i < 64; ++i) {
                  if (mask & (std::uint64_t(1) << i)) {
                      if (lo == 64) lo = i;
                      hi = i;
                  }
              }
              if (BitScan::lowestSetBit64(mask) == lo && BitScan::highestSetBit64(mask) == hi) return true;
              std::fprintf(stderr, "Bit-scan mismatch for mask %llu\\n", static_cast<unsigned long long>(mask));
              return false;
          }

          int main() {
              if (!check(0) || !check(~std::uint64_t(0))) return 1;
              for (unsigned i = 0; i < 64; ++i) {
                  if (!check(std::uint64_t(1) << i)) return 1;
                  for (unsigned j = i; j < 64; ++j) {
                      if (!check((std::uint64_t(1) << i) | (std::uint64_t(1) << j))) return 1;
                  }
              }
              std::uint64_t state = 0x9e3779b97f4a7c15ULL;
              for (unsigned i = 0; i < 10000; ++i) {
                  state ^= state << 13;
                  state ^= state >> 7;
                  state ^= state << 17;
                  if (!check(state)) return 1;
              }
              std::puts("Bit-scan regression tests passed (12146 masks).");
              return 0;
          }
          '''.replace('\n          ', '\n'), encoding='utf-8')
      - name: Test portable bit scans
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/compiler/bit_scan_test.cpp -o /tmp/neontide-bit-scan-test
          /tmp/neontide-bit-scan-test
          git diff --check
      - name: Commit only the reviewed repair files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/bits.h src/gfx/gfx_context.cpp src/main.cpp build.bat tests/compiler/bit_scan_test.cpp
          git commit -m 'fix: support MSVC bit scans and isolate Windows small macro'
          git push origin HEAD:fix/windows-build
